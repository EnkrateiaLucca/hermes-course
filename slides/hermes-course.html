<h1 id="local-agents-with-emhermesem">Local Agents with <em>Hermes</em></h1>
<p>A persistent personal agent, explained against the Claude Code you already run.<br />
<span style="font-size:0.8em;opacity:0.7">2h 30m · links on these slides are clickable</span></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-marpit-fragments="5" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="2" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<div class="kicker">Agenda</div>
<h2 id="what-well-cover">What we'll cover</h2>
<ol>
<li data-marpit-fragment="1"><strong>The landscape</strong> — models, harnesses, and where Hermes sits · 30m</li>

<li data-marpit-fragment="3"><strong>Memory &amp; skills</strong> — the part only Hermes defaults to · 30m</li>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-class="lead dark" data-theme="automata" lang="en-US" class="lead dark" data-marpit-pagination="3" style="--paginate:true;--class:lead dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">Block 1</div>
<h1 id="the-local-ai-agent-emlandscapeem">The local AI agent <em>landscape</em></h1>
<p>No installs yet. Mental map first.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-class="dark quote" data-theme="automata" lang="en-US" class="dark quote" data-marpit-pagination="4" style="--paginate:true;--class:dark quote;--theme:automata;" data-marpit-pagination-total="64">
<blockquote>
<p><span class="mark">&quot;</span>The personal in personal agent is not the model… it's the agent's memory of your conversations and the skills you've built with it.<span class="mark">&quot;</span></p>
</blockquote>
<div class="by">— <a href="https://creatoreconomy.so/p/hermes-co-founder-on-building-an-ai-agent-that-improves-itself-karan-malhotra">Karan Malhotra</a>, co-founder, Nous Research</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-fragments="3" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="no-weights-change--anywhere">No weights change — anywhere</h2>
<p><strong>&quot;Self-improves through use, not retraining&quot; means no weights change.</strong></p>
<ul>
<li data-marpit-fragment="1">Not in Hermes. Not in Claude Code. Not anywhere today.</li>
<li data-marpit-fragment="2">&quot;Not retraining&quot; just means &quot;no fine-tuning.&quot;</li>
<li data-marpit-fragment="3">Everything here is <em>context engineering</em> — files written to disk and re-injected into a prompt.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="why-local-agents-now">Why local agents, now</h2>
<div class="bento">
<div class="cell wide"><h3>Persistence</h3><p>State survives the session without a vendor's storage model in the loop.</p></div>
<div class="cell"><h3>Privacy</h3><p>The context layer is the sensitive part — your files, your clients.</p></div>
<div class="cell"><h3>$0 marginal</h3><p>The 400th cron run costs electricity. That's what makes always-on reasonable.</p></div>
<div class="cell wide"><h3>What actually changed in 2026</h3><p>Not the models. Hermes (Feb 2026) made a memory-carrying local agent turnkey. The pieces existed; the bundling didn't.</p></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="three-layers-people-keep-collapsing">Three layers people keep collapsing</h2>
<div class="flow">
<div class="step"><h3>Model</h3><p>Qwen3.5-9B · Qwen3.6-35B-A3B · Hermes 4.3 36B<br /><em>swappable</em></p></div>
<div class="arrow">↑</div>
<div class="step"><h3>Harness</h3><p>Hermes · Claude Code · OpenClaw<br /><em>loop, tools, safety</em></p></div>
<div class="arrow">↑</div>
<div class="step"><h3>Agent</h3><p>instructions + memory + skills<br /><em>the durable asset</em></p></div>
</div>
<p><strong>Hermes is a persistent personal-agent harness.</strong> Claude Code is a coding harness that happens to persist a little.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="five-primitives-and-their-claude-code-neighbor">Five primitives, and their Claude Code neighbor</h2>
<table>
<thead>
<tr>
<th>Hermes primitive</th>
<th>What it is</th>
<th>Claude Code neighbor</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Tools</strong></td>
<td>fs, ripgrep, terminal, web, browser</td>
<td>Read/Edit/Bash/Grep</td>
</tr>
<tr>
<td><strong>Integrations + MCP</strong></td>
<td>messaging providers + any MCP server</td>
<td>MCP servers</td>
</tr>
<tr>
<td><strong>Skills</strong></td>
<td><code>SKILL.md</code>, progressive disclosure</td>
<td>Skills — <em>same</em> standard</td>
</tr>
<tr>
<td><strong>Cron</strong></td>
<td>scheduled self-contained runs</td>
<td><code>/loop</code>, cloud agents</td>
</tr>
<tr>
<td><strong>Memory</strong></td>
<td><code>MEMORY.md</code> + <code>USER.md</code> + FTS5 log</td>
<td><code>CLAUDE.md</code> + Auto Memory</td>
</tr>
</tbody>
</table>
<p>The vocabulary maps ~1:1. What differs is what runs <strong>by default and unattended</strong>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="where-things-live">Where things live</h2>
<table>
<thead>
<tr>
<th>Purpose</th>
<th>Hermes</th>
<th>Claude Code</th>
</tr>
</thead>
<tbody>
<tr>
<td>Project instructions</td>
<td><code>AGENTS.md</code> (repo root)</td>

</tr>
<tr>
<td>Global personality</td>
<td><code>SOUL.md</code> (<code>~/.hermes/</code>)</td>
<td><code>~/.claude/CLAUDE.md</code></td>
</tr>

<td><code>MEMORY.md</code>, <code>USER.md</code></td>
<td>Auto Memory</td>
</tr>
<tr>
<td>Procedures</td>
<td><code>~/.hermes/skills/*/SKILL.md</code></td>
<td><code>~/.claude/skills/*/SKILL.md</code></td>
</tr>
<tr>

<td><code>config.yaml</code>, <code>.env</code></td>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="picking-a-local-model--ask-in-this-order">Picking a local model — ask in this order</h2>
<div class="flow">
<div class="step"><h3>1 · RAM</h3><p>A hard wall, not a preference</p></div>
<div class="arrow">→</div>
<div class="step"><h3>2 · Task</h3><p>Long-horizon tool use punishes small models</p></div>
<div class="arrow">→</div>
<div class="step"><h3>3 · Tool calls</h3><p>The one that actually decides it</p></div>
</div>
<p>A model that writes beautiful prose and mangles a JSON tool call is <em>useless in a harness</em>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="the-shortlist">The shortlist</h2>
<table>
<thead>
<tr>
<th>Model</th>
<th>RAM</th>
<th>Where it fits</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Qwen3.5-9B</strong></td>
<td>8 GB+ at 64K · ~10 GB at 128K</td>
<td>Official Mac starter pick, quantized</td>
</tr>
<tr>
<td><strong>Qwen3.6-35B-A3B</strong></td>
<td>32 GB+</td>
<td>Daily driver, NVIDIA-endorsed default</td>
</tr>
<tr>
<td><strong>Hermes 4.3 36B</strong></td>
<td>32 GB+</td>
<td>Nous's own, tuned for tool calling</td>
</tr>
</tbody>
</table>
<p><strong>Hard requirement regardless: the model must serve ≥64K context.</strong><br />
System prompt + context files + tool defs + a real conversation does not fit in 8K.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="the-tool-call-parser-story">The tool-call parser story</h2>
<p>Every model family emits tool calls differently — XML-ish, JSON blocks, custom tokens.<br />
The harness needs a <strong>parser per family</strong> to normalize them.</p>
<p>Nous ships a first-class <code>--tool-call-parser hermes</code> for vLLM.</p>
<blockquote>
<p>When a local model &quot;doesn't work&quot; with an agent, <strong>the parser is the first suspect</strong> — not the model's intelligence.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="the-landscape-one-line-each">The landscape, one line each</h2>
<div class="bento">
<div class="cell wide"><h3>Hermes</h3><p>Persistent workflows, learns from work, one agent across CLI <em>and</em> messaging.</p></div>
<div class="cell"><h3>Claude Code + Ollama</h3><p>Deep IDE integration, mature tooling, focused sessions.</p></div>
<div class="cell"><h3>OpenClaw</h3><p>Lightest setup, pure CLI coding.</p></div>
</div>
<p><strong>The rule:</strong> pick Hermes when the accumulated context is the point; pick a stateless coding agent when each session is disposable.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-class="lead dark" data-theme="automata" lang="en-US" class="lead dark" data-marpit-pagination="14" style="--paginate:true;--class:lead dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">Block 2 · Hands-on</div>
<h1 id="your-first-emhermes-agentem">Your first <em>Hermes agent</em></h1>
<p>Plumbing before personality.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="15" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">Install</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash
<span class="hljs-built_in">source</span> ~/.zshrc
hermes --version
</code></pre>
<p>Windows: PowerShell one-liner. Mac: also a Desktop installer.</p>
<p><code>pip install hermes-agent</code> exists (Nous-published) but lags the installer — use the installer.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="16" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">Point it at a local model</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">hermes model            <span class="hljs-comment"># → choose &quot;Custom endpoint&quot;</span>

brew install llama.cpp
llama-server -m qwen3.5-9b-q4.gguf \
  -c 131072 --cache-type-k q4_0 --cache-type-v q4_0 --port 8080
<span class="hljs-comment"># → http://localhost:8080/v1</span>

hermes --tui
</code></pre>
<p><code>-c 131072</code> + q4 KV ≈ 10 GB — on 8 GB use <code>-c 65536</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-marpit-fragments="4" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="17" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="mac-path-llamacpp-or-mlx--not-ollama">Mac path: llama.cpp or MLX — not Ollama</h2>
<ul>
<li data-marpit-fragment="1">The official Mac guide points at <strong>llama.cpp</strong> (lower latency, <code>:8080</code>) or <strong>omlx/MLX</strong> (higher throughput, <code>:8000</code>) behind a Custom endpoint.</li>
<li data-marpit-fragment="2">Ollama works (<code>OLLAMA_API_KEY</code>) — it just isn't the doc's Mac path.</li>
<li data-marpit-fragment="3">One-command alternative (v0.21.6+): <code>hermes model</code> → <strong>Local models</strong> installs llama.cpp and picks a model that fits.</li>
<li data-marpit-fragment="4"><strong>Pick one server and stick with it.</strong> Mixing them mid-session produces unreproducible failures.</li>
</ul>
<p><strong>Claude Code contrast:</strong> you never pick a model <em>server</em>, only a model name. Here you own the whole inference stack.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-marpit-fragments="6" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="18" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="two-context-files-two-scopes">Two context files, two scopes</h2>
<div class="two-col">
<div>
<h3 id="soulmd"><code>SOUL.md</code></h3>
<p><code>~/.hermes/SOUL.md</code></p>
<ul>
<li data-marpit-fragment="1">Personality, values, boundaries, tone</li>
<li data-marpit-fragment="2"><strong>Global and durable</strong></li>
<li data-marpit-fragment="3">Survives a model swap</li>
</ul>
</div>
<div>
<h3 id="agentsmd"><code>AGENTS.md</code></h3>
<p>project root</p>
<ul>
<li data-marpit-fragment="4">Architecture, conventions, hard rules</li>
<li data-marpit-fragment="5"><strong>Per-project</strong>, loaded from CWD at session start</li>
<li data-marpit-fragment="6">Subdirectory copies load lazily</li>
</ul>
</div>
</div>
<p>Bonus: Hermes auto-reads <code>.cursorrules</code> and <code>.cursor/rules/*.mdc</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="19" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">SOUL.md — the anti-sycophancy demo</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown"><span class="hljs-section"># SOUL</span>

<span class="hljs-section">## How you talk</span>
<span class="hljs-bullet">-</span> Lead with the answer. Context after, only if it changes the answer.
<span class="hljs-bullet">-</span> Never open with &quot;You&#x27;re absolutely right&quot; or any variant.
<span class="hljs-bullet">-</span> When you disagree, say so in one sentence and give the reason.

<span class="hljs-section">## Boundaries</span>
<span class="hljs-bullet">-</span> Never run destructive commands without showing them first.
<span class="hljs-bullet">-</span> Say &quot;I don&#x27;t know&quot; rather than guessing at a file path or an API.
</code></pre>
<p>Personality is a <strong>context artifact, not a weights artifact.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="20" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">AGENTS.md — the project brain</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown"><span class="hljs-section"># AGENTS.md</span>

<span class="hljs-section">## Project</span>
FastAPI service, Postgres, on Fly. Entry point: <span class="hljs-code">`app/main.py`</span>.

<span class="hljs-section">## Conventions</span>
<span class="hljs-bullet">-</span> <span class="hljs-code">`uv`</span> for deps. Never edit <span class="hljs-code">`requirements.txt`</span> by hand.
<span class="hljs-bullet">-</span> Tests in <span class="hljs-code">`tests/`</span>, run with <span class="hljs-code">`pytest -q`</span>.

<span class="hljs-section">## Hard rules</span>
<span class="hljs-bullet">-</span> Never commit <span class="hljs-code">`.env`</span> or anything under <span class="hljs-code">`secrets/`</span>.
<span class="hljs-bullet">-</span> Never touch <span class="hljs-code">`migrations/`</span> without being asked explicitly.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-fragments="3" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="21" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="context-files-and-the-prompt-cache">Context files and the prompt cache</h2>
<p>Context files are part of the <strong>stable system prompt</strong> — which is what earns prompt-cache hits.</p>
<ul>
<li data-marpit-fragment="1">Editing them mid-session <strong>breaks the cache</strong>. You pay a full re-read.</li>
<li data-marpit-fragment="2">Write them once, deliberately, at session start.</li>
<li data-marpit-fragment="3">Every character costs on <em>every turn</em>.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="22" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="turn-on-tools-in-blast-radius-order">Turn on tools in blast-radius order</h2>
<div class="timeline">
<div class="pt"><div class="dot"></div><div class="when">Rung 1 · Read-only</div><div class="what">filesystem read, ripgrep → worst case: wasted tokens</div></div>
<div class="pt"><div class="dot"></div><div class="when">Rung 2 · Draft-only</div><div class="what">new scratch files; generate commands, <em>don't</em> execute → a junk file</div></div>
<div class="pt"><div class="dot"></div><div class="when">Rung 3 · Reversible</div><div class="what">edit files inside a git repo → <code>git checkout .</code></div></div>
<div class="pt"><div class="dot"></div><div class="when">Rung 4 · Irreversible</div><div class="what">delete, terminal, send, spend, prod → you explain it to someone</div></div>
</div>
<p>Rung 2 is the underrated one: <strong>read the command yourself before running it.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="23" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="command-approval-is-the-safety-net">Command approval is the safety net</h2>
<p>Every command is checked against a curated dangerous-pattern list — recursive deletes, SQL drops, piping curl into a shell.</p>
<p>Four answers: <strong>once / session / always / deny</strong></p>
<p>Default <code>mode: smart</code> auto-decides the clear cases; set <code>manual</code> to see the prompt.</p>
<blockquote>
<p>Choose <strong><code>session</code></strong>, not <code>always</code>. <code>always</code> is a permanent grant made at the moment you have the least evidence.</p>
</blockquote>
<p>Same decision as Claude Code's permission modes. Identical failure mode.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-fragments="3" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="24" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="run-one-real-task--and-leave-it-uncut">Run one real task — and leave it uncut</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Summarize this repo in 5 bullets and name the main entrypoint.
</code></pre>
<ul>
<li data-marpit-fragment="1">Watch tool calls land against your <em>local</em> model.</li>
<li data-marpit-fragment="2">Point at where the per-model parser normalizes the format.</li>
<li data-marpit-fragment="3"><strong>Failures are the lesson.</strong> Don't edit them out.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-fragments="3" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="25" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="prompting-discipline">Prompting discipline</h2>
<ul>
<li data-marpit-fragment="1"><strong>Be specific.</strong> &quot;Fix the <code>TypeError</code> in <code>api/handlers.py:47</code>&quot; — not &quot;fix the code.&quot;</li>
<li data-marpit-fragment="2"><strong>Front-load context.</strong> Paste the traceback. Paste the screenshot (<code>Ctrl+V</code>).</li>
<li data-marpit-fragment="3"><strong>Let the agent use its tools.</strong> &quot;Find and fix the failing test&quot; beats dictating each step.</li>
</ul>
<p>Same instinct as Claude Code: dictate the goal, not the path.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="26" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="cli-power-use">CLI power-use</h2>
<table>
<thead>
<tr>
<th>Key / command</th>
<th>Does</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>Alt+Enter</code> · <code>Ctrl+J</code> · <code>Shift+Enter</code></td>
<td>Multi-line input</td>
</tr>
<tr>
<td><code>Ctrl+C</code> once</td>
<td>Interrupt &amp; redirect · twice in 2s = exit</td>
</tr>
<tr>
<td><code>Ctrl+V</code></td>
<td>Paste a clipboard image (vision)</td>
</tr>
<tr>
<td><code>/</code> + <code>Tab</code></td>
<td>Autocomplete commands and skills</td>
</tr>
<tr>
<td><code>/verbose</code></td>
<td>Cycles off → new → all → verbose</td>
</tr>
<tr>
<td><code>hermes -c</code> · <code>hermes -r &quot;title&quot;</code></td>
<td>Resume by history / by title</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-fragments="3" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="27" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="the-60-second-eval-habit">The 60-second eval habit</h2>
<ul>
<li data-marpit-fragment="1">You cannot tell whether a local model is good enough by vibes.</li>
<li data-marpit-fragment="2">&quot;The answer felt right&quot; is not a signal.</li>
<li data-marpit-fragment="3">The signal is: <strong>did it call the right tool with the right arguments?</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="28" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">25 rows of real tasks</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-csv">id,task,expected_tool,expected_args,category
1,What files are in src/?,search_files,target=files path=src/,read-only
2,Find every use of get_user,search_files,target=content pattern=get_user,search
12,Run the test suite,terminal,cmd contains pytest,terminal
21,Drop the users table,terminal,,danger
24,What's 2+2?,none,,no-op
</code></pre>
<p>Score two columns only: <strong>right tool?</strong> and <strong>right arguments?</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-eFrLBbhX="" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="29" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="what-the-eval-set-buys-you">What the eval set buys you</h2>
<div class="stat-grid">
<div class="stat"><div class="num">1</div><div class="label">A go / no-go on a local model — below ~80% you'll blame the wrong layer</div></div>
<div class="stat"><div class="num">2</div><div class="label">An objective comparison of two models — same 25 rows, two numbers</div></div>
<div class="stat"><div class="num">3</div><div class="label">A regression check — adding tools <em>can</em> degrade tool selection</div></div>
</div>
<p>Re-run it after Block 3's skill and Block 4's MCP server.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-class="lead dark" data-theme="automata" lang="en-US" class="lead dark" data-marpit-pagination="30" style="--paginate:true;--class:lead dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">Block 3</div>
<h1 id="memory-and-skills-emin-actionem">Memory and skills <em>in action</em></h1>
<p>The part only Hermes turns on by default.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="31" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="three-kinds-of-durable-state">Three kinds of durable state</h2>
<table>
<thead>
<tr>
<th>Kind</th>
<th>What it is</th>
<th>Where</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Authored instructions</strong></td>
<td>What you told it</td>
<td><code>SOUL.md</code>, <code>AGENTS.md</code></td>
</tr>
<tr>
<td><strong>Learned facts</strong></td>
<td>What it noticed and kept</td>
<td><code>MEMORY.md</code>, <code>USER.md</code></td>
</tr>
<tr>
<td><strong>Learned procedures</strong></td>
<td>How to do a repeated thing</td>
<td><code>skills/*/SKILL.md</code></td>
</tr>
</tbody>
</table>
<p>Plus a fourth thing that's history, not state: an <strong>SQLite/FTS5 log of every session</strong>, searchable with <code>session_search</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-marpit-fragments="4" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="32" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="teach-the-accuracy-note-dont-hide-it">Teach the accuracy note, don't hide it</h2>
<p>Nous markets a <strong>&quot;four-tier memory.&quot;</strong> What the docs describe:</p>
<ul>
<li data-marpit-fragment="1"><code>MEMORY.md</code> + <code>USER.md</code> + the FTS5 session log</li>
<li data-marpit-fragment="2">Honcho and Obsidian are <strong>opt-in add-ons</strong>, not built-in tiers</li>
<li data-marpit-fragment="3"><code>SOUL.md</code> is counted as a tier but is <strong>config/identity — you wrote it, it didn't learn it</strong></li>
<li data-marpit-fragment="4">The Curator's <strong>LLM-consolidation is OFF by default</strong> (50–100 API calls a pass)</li>
</ul>
<p>Presenting this straight buys you the whole room.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="33" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="memory-is-bounded-and-frozen-mid-session">Memory is bounded, and frozen mid-session</h2>
<div class="stat-grid">
<div class="stat"><div class="num">2,200</div><div class="label">chars in MEMORY.md</div></div>
<div class="stat"><div class="num">1,375</div><div class="label">chars in USER.md</div></div>
<div class="stat"><div class="num">next</div><div class="label">session before a write reaches the system prompt</div></div>
</div>
<p>Small on purpose — these sit in the system prompt on <em>every</em> turn. Force a cleanup with <em>&quot;clean up your memory.&quot;</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="34" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">Demo this live</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>&gt; remember that our CI uses GitHub Actions
✓ saved to memory

&gt; what CI do we use?
I don't have that in memory.
</code></pre>
<p><strong>Not a bug.</strong> The write landed on disk; it reaches the system prompt next session.<br />
Show it, or a student hits it alone at 11pm and concludes the feature is broken.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="35" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="session-search--the-genuinely-distinct-one">Session search — the genuinely distinct one</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>what were we talking about last month re: the pricing model?
</code></pre>
<p><code>session_search</code> runs FTS5 over <strong>all</strong> past raw conversations. Nothing loads until it's needed.</p>
<blockquote>
<p>This is one of two things a Claude Code power user can't replicate without building it. Claude Code's memory is curated notes — <strong>not indexed transcripts.</strong></p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-class="dark quote" data-theme="automata" lang="en-US" class="dark quote" data-marpit-pagination="36" style="--paginate:true;--class:dark quote;--theme:automata;" data-marpit-pagination-total="64">
<blockquote>
<p><span class="mark">&quot;</span>Reference document → skill. Sticky note → memory.<span class="mark">&quot;</span></p>
</blockquote>
<div class="by">— Hermes docs, on what goes where</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="37" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="skills-procedural-and-free-until-used">Skills: procedural, and free until used</h2>
<p>Same standard as Claude Code — <a href="https://agentskills.io">agentskills.io</a>, <code>SKILL.md</code>, three stages:</p>
<div class="flow">
<div class="step"><h3>1 · Name + description</h3><p>~100–200 tokens<br /><em>always in context</em></p></div>
<div class="arrow">→</div>
<div class="step"><h3>2 · SKILL.md body</h3><p>loads on trigger<br /><em>keep under ~500 lines</em></p></div>
<div class="arrow">→</div>
<div class="step"><h3>3 · Reference files</h3><p>read on demand<br /><em>one at a time</em></p></div>
</div>
<p>In Hermes these are literal calls: <code>skills_list()</code> → <code>skill_view(name)</code> → <code>skill_view(name, file)</code>.</p>
<p><strong>Promote to a skill when a task is 5+ steps <em>and</em> repeats.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-fragments="2" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="38" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="two-authoring-rules-that-fall-straight-out">Two authoring rules that fall straight out</h2>
<ul>
<li data-marpit-fragment="1"><strong>Directives, not essays.</strong> Layer 1 is an always-on cost on every model call.</li>
<li data-marpit-fragment="2"><strong>If the workflow is a fixed deterministic sequence — write a script, not a skill.</strong> Don't spend model tokens on work a bash file does perfectly.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="39" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="the-objection-you-will-get">The objection you will get</h2>
<blockquote>
<p><em>&quot;Claude Code can also write files and update <code>CLAUDE.md</code>. So what?&quot;</em></p>
</blockquote>
<p><strong>They're right.</strong> No weights change in any of these tools.</p>
<p>The real question isn't <em>can</em> an agent persist state — they all can.<br />
It's <strong>how much of the loop is autonomous, always-on, and default.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="40" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="the-self-improvement-ladder">The self-improvement ladder</h2>
<div class="timeline">
<div class="pt"><div class="dot"></div><div class="when">Rung 1</div><div class="what">Can write a file if told. Proves nothing.</div></div>
<div class="pt"><div class="dot"></div><div class="when">Rung 2</div><div class="what">User-triggered persistence — <code>CLAUDE.md</code>, <code>AGENTS.md</code>. Authored, not curated.</div></div>
<div class="pt"><div class="dot"></div><div class="when">Rung 3</div><div class="what">Autonomously decides what to remember, unprompted.</div></div>
<div class="pt"><div class="dot"></div><div class="when">Rung 4</div><div class="what">+ unattended long-horizon curation; retrieval by <em>search</em>.</div></div>
<div class="pt"><div class="dot"></div><div class="when">Rung 5</div><div class="what">+ autonomous skill synthesis <em>and retirement</em> from usage stats.</div></div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-fragments="3" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="41" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="where-each-tool-actually-lands">Where each tool actually lands</h2>
<ul>
<li data-marpit-fragment="1"><strong>Claude Code</strong> → <strong>rung 3.</strong> Auto Memory decides what to keep. It has the full substrate for 4–5 — skills are first-class and portable — but a human or a hook drives skill creation, and nothing prunes old memory in the background.</li>
<li data-marpit-fragment="2"><strong>Letta (MemGPT)</strong> → arguably <strong>ahead on rung 4.</strong> Self-editing memory has been its architecture since 2023, plus &quot;sleep-time&quot; consolidation. No skill authoring.</li>
<li data-marpit-fragment="3"><strong>Hermes</strong> → the one documented running <strong>3→5 wired together, on by default.</strong></li>
</ul>
<p><strong>Say it out loud: the differentiator is default integration, not intelligence.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="42" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">Hands-on · make the agent learn</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># after a genuinely 5+ step task:</span>
&gt; save what you just did as a skill called deploy-staging

<span class="hljs-comment"># or by hand:</span>
<span class="hljs-built_in">mkdir</span> -p ~/.hermes/skills/deploy-staging
<span class="hljs-variable">$EDITOR</span> ~/.hermes/skills/deploy-staging/SKILL.md
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown">---
name: deploy-staging
description: Deploy the current branch to staging and verify health.
<span class="hljs-section">  Use when asked to deploy, ship, or push to staging.
---</span>
<span class="hljs-bullet">1.</span> Confirm the working tree is clean; stop if not.
<span class="hljs-bullet">2.</span> <span class="hljs-code">`pytest -q`</span> — stop on any failure.
<span class="hljs-bullet">3.</span> <span class="hljs-code">`fly deploy --config fly.staging.toml`</span>
<span class="hljs-bullet">4.</span> Poll /health until 200, max 60s. Report SHA + latency.
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="43" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="then-re-run-it-as-deploy-staging">Then re-run it as <code>/deploy-staging</code></h2>
<p>Five minutes of agent reasoning becomes <strong>one slash command</strong>, loaded instantly.</p>
<p>That contrast is the whole block. It lands better shown than described.</p>
<p><strong>Then re-run the eval CSV.</strong> A new skill changes the always-loaded description budget and can shift tool selection. Prove it didn't regress.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="44" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="the-community-skill-layer">The community skill layer</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>/skills                 # what you have
/skills browse          # the Skills Hub
hermes skills install official/&lt;name&gt;
</code></pre>
<p><strong>Skills you write for Claude Code are portable to Hermes and back.</strong> Same format, same progressive-disclosure contract.</p>
<p>Your skill library is not harness lock-in. Consumer first, then producer.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-class="lead dark" data-theme="automata" lang="en-US" class="lead dark" data-marpit-pagination="45" style="--paginate:true;--class:lead dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">Block 4</div>
<h1 id="mcp-deployment-emand-reachem">MCP, deployment, <em>and reach</em></h1>
<p>Wire it low-blast-radius first. Prove it. Then widen.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="46" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">~/.hermes/config.yaml</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">mcp_servers:</span>
  <span class="hljs-attr">filesystem:</span>
    <span class="hljs-attr">command:</span> <span class="hljs-string">npx</span>
    <span class="hljs-attr">args:</span> [<span class="hljs-string">&quot;-y&quot;</span>, <span class="hljs-string">&quot;@modelcontextprotocol/server-filesystem&quot;</span>,
           <span class="hljs-string">&quot;/Users/you/projects&quot;</span>]     <span class="hljs-comment"># scope it, not $HOME</span>
    <span class="hljs-attr">tools:</span>
      <span class="hljs-attr">include:</span> [<span class="hljs-string">read_text_file</span>, <span class="hljs-string">list_directory</span>]   <span class="hljs-comment"># start read-only</span>

  <span class="hljs-attr">fetch:</span>
    <span class="hljs-attr">command:</span> <span class="hljs-string">uvx</span>
    <span class="hljs-attr">args:</span> [<span class="hljs-string">&quot;mcp-server-fetch&quot;</span>]
</code></pre>
<p>Tools register as <strong><code>mcp_&lt;server&gt;_&lt;tool&gt;</code></strong> — useful when debugging a wrong pick.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="47" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="toolsinclude-is-a-security-control"><code>tools.include</code> is a security control</h2>
<p>Not a tidiness feature. An MCP server hands the agent whatever it feels like exposing.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>hermes mcp                # picker
hermes mcp install &lt;name&gt;
/reload-mcp               # no session restart
</code></pre>
<blockquote>
<p>An MCP server's tool <strong>descriptions enter your model's context.</strong> A malicious one is a prompt-injection surface. Read what you install.</p>
</blockquote>
<p>OAuth and mTLS supported for remote servers. Parallel calls work.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="48" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="hermes-as-an-mcp-server">Hermes as an MCP server</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">hermes mcp serve
</code></pre>
<p>Exposes Hermes's <strong>messaging bridge</strong> — list, read and send conversations across your connected platforms. Claude Code can message your Telegram through Hermes.</p>
<p>These aren't competing harnesses. One can be the other's tool.</p>
<p><strong>Then re-run the eval CSV.</strong> New tools, new chances to pick the wrong one.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="49" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="where-it-runs--7-execution-backends">Where it runs — 7 execution backends</h2>
<table>
<thead>
<tr>
<th>Backend</th>
<th>Use it for</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Local</strong></td>
<td>Your machine, your files, fastest</td>
</tr>
<tr>
<td><strong>Docker</strong></td>
<td>Untrusted code, isolation, reproducible env</td>
</tr>
<tr>
<td><strong>SSH</strong></td>
<td>An always-on box you already own</td>
</tr>
<tr>
<td><strong>Modal · Daytona · Vercel Sandbox</strong></td>
<td>Serverless, hibernates, <strong>~$0 idle</strong></td>
</tr>
</tbody>
</table>
<p>The brain — memory, skills, config — is a directory of files. The backend under it is swappable. <strong>Tasks survive crashes and reboots.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-marpit-fragments="3" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="50" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="the-gateway-one-agent-everywhere-you-type">The gateway: one agent, everywhere you type</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">hermes gateway setup
hermes gateway install   <span class="hljs-comment"># launchd / systemd</span>
hermes gateway
</code></pre>
<ul>
<li data-marpit-fragment="1"><strong>The same agent</strong> on CLI, Telegram, Slack, Discord, Email — 30+ platforms</li>
<li data-marpit-fragment="2">Per-chat session state that <strong>follows you across devices</strong></li>
<li data-marpit-fragment="3">Sessions never auto-reset unless you opt in via <code>session_reset</code></li>
</ul>
<p>The capability with no Claude Code equivalent: the agent that holds your memory is the one answering from the train.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="51" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">Optional live add-on · WhatsApp</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">hermes whatsapp          <span class="hljs-comment"># QR wizard → Linked Devices</span>

<span class="hljs-comment"># ~/.hermes/.env</span>
WHATSAPP_ENABLED=<span class="hljs-literal">true</span>
WHATSAPP_MODE=bot
WHATSAPP_ALLOWED_USERS=+15551234567

<span class="hljs-built_in">chmod</span> 700 ~/.hermes/whatsapp-session   <span class="hljs-comment"># these are live credentials</span>
</code></pre>
<p>Via Baileys — no Meta dev account. Unofficial client: WhatsApp can ban the number.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-class="dark" data-theme="automata" lang="en-US" class="dark" data-marpit-pagination="52" style="--paginate:true;--class:dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">Cron — durability with a schedule</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">/cron add <span class="hljs-string">&quot;0 8 * * 1-5&quot;</span> \
  <span class="hljs-string">&quot;Check ~/projects/api for PRs opened since yesterday. \
   Summarize each in one line. If none, reply [SILENT].&quot;</span> \
  --name morning-prs --deliver telegram
</code></pre>
<table>
<thead>
<tr>
<th>Flag</th>
<th>Does</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>--script</code></td>
<td>Python preflight; stdout → agent context</td>
</tr>
<tr>
<td><code>--skill</code></td>
<td>Attach a skill (stackable)</td>
</tr>
<tr>
<td><code>--deliver</code></td>
<td>telegram / discord / slack / origin / local</td>
</tr>
<tr>
<td><code>[SILENT]</code></td>
<td>Suppress the message on a no-op</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-marpit-fragments="4" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="53" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="the-cron-gotcha-and-the-ladder">The cron gotcha, and the ladder</h2>
<p><strong>Cron runs in a fresh, self-contained session.</strong> No history, no implicit CWD.</p>
<ul>
<li data-marpit-fragment="1">&quot;Check the repo&quot; is meaningless. &quot;Check <code>~/projects/api</code>&quot; is not.</li>
<li data-marpit-fragment="2"><code>[SILENT]</code> is what makes monitors tolerable — a health check that pings 364 times to say &quot;fine&quot; gets muted by day three.</li>
<li data-marpit-fragment="3"><strong>First version: read-only, <code>--deliver local</code>.</strong> Watch it a day. <em>Then</em> let it write and message you.</li>
<li data-marpit-fragment="4">Always <code>/cron run &lt;name&gt;</code> once before trusting a schedule.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="54" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="the-prompt-cache-is-the-cost-lever">The prompt cache is the cost lever</h2>
<p>A <strong>stable system prompt</strong> earns cache hits. Local model → latency. Hosted → money.</p>
<p><strong>What breaks it:</strong> <code>/model</code> switches · provider fallbacks · credential rotation · editing <code>SOUL.md</code>/<code>AGENTS.md</code> mid-session.</p>
<blockquote>
<p>Prefer starting a <strong>fresh session</strong> on the other model over bouncing back and forth mid-conversation.</p>
</blockquote>
<p><code>/compress</code> · <code>/usage</code> · <code>hermes prompt-size</code> (offline) · <code>/insights</code> (30-day patterns)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-marpit-fragments="2" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="55" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="scale-out-when-one-session-is-the-wrong-shape">Scale out when one session is the wrong shape</h2>
<ul>
<li data-marpit-fragment="1"><strong><code>delegate_task</code></strong> — parallel independent subagents. Same instinct as Claude Code's subagents: fan out work whose <em>results</em> you need but whose intermediate output you don't want in context.</li>
<li data-marpit-fragment="2"><strong><code>execute_code</code></strong> — one batch script beats twenty terminal round-trips. Each round-trip is a full model call; the script is one.</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="56" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="security-containers-skip-the-danger-check">Security: containers skip the danger check</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">TERMINAL_ENV=docker
TERMINAL_DOCKER_IMAGE=python:3.13-slim
</code></pre>
<blockquote>
<p><strong>Docker, Singularity, Modal, Daytona, and Vercel Sandbox SKIP the dangerous-command check.</strong> The container <em>is</em> the security boundary — by design.</p>
</blockquote>
<p>The right setup for untrusted code. <strong>The wrong setup if you assumed approval prompts were still firing.</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="57" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="never-do-this">Never do this</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">GATEWAY_ALLOW_ALL_USERS=<span class="hljs-literal">true</span>    <span class="hljs-comment"># on a terminal-enabled bot</span>
</code></pre>
<p>That is a public shell on your machine.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">TELEGRAM_ALLOWED_USERS=...
DISCORD_ALLOWED_USERS=...
GATEWAY_ALLOWED_USERS=...        <span class="hljs-comment"># cross-platform</span>
</code></pre>
<p>Plus: secrets in <code>~/.hermes/.env</code> — never in <code>config.yaml</code>, never in <code>AGENTS.md</code>.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-class="lead dark" data-theme="automata" lang="en-US" class="lead dark" data-marpit-pagination="58" style="--paginate:true;--class:lead dark;--theme:automata;" data-marpit-pagination-total="64"><div class="kicker">Block 5</div>
<h1 id="when-to-use-emwhichem">When to use <em>which</em></h1>
<p>Pick correctly. Defend the pick.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="59" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="the-matrix">The matrix</h2>
<table>
<thead>
<tr>
<th>Use…</th>
<th>When it's best</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Hermes</strong></td>
<td>Persistent workflows, learning-from-work, one agent across CLI <em>and</em> messaging</td>
</tr>
<tr>
<td><strong>Claude Code + Ollama</strong></td>
<td>Deep IDE integration, mature tooling, focused coding sessions</td>
</tr>
<tr>
<td><strong>OpenClaw</strong></td>
<td>Lightest setup, pure CLI coding</td>
</tr>
</tbody>
</table>
<p><strong>The rule:</strong> pick Hermes when the accumulated context is the point; pick a stateless coding agent when each session is disposable.</p>
<p>Wanting both is the correct answer — <code>hermes mcp serve</code> lets Claude Code reach your messaging through Hermes.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="60" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="the-honest-verdict-true-but-not-unique">The honest verdict: true, but not unique</h2>
<table>
<thead>
<tr>
<th></th>
<th>Persistent memory</th>
<th>Unattended curation</th>
<th>Cross-session FTS</th>
<th>Agent-<em>authored</em> skills</th>
<th>Default?</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Hermes</strong></td>
<td>Yes</td>
<td><strong>Yes</strong> (Curator ~7d)</td>
<td><strong>Yes</strong></td>
<td><strong>Yes</strong></td>
<td><strong>Automatic</strong></td>
</tr>
<tr>
<td><strong>Claude Code</strong></td>
<td>Yes</td>
<td>Partial — trims, no prune</td>
<td>No</td>
<td>Not unprompted</td>
<td>Memory yes, skills manual</td>
</tr>
<tr>
<td><strong>OpenClaw</strong></td>
<td>Yes</td>
<td>Unverified</td>
<td>Unverified</td>
<td>Partial (ClawHub)</td>
<td>Unverified</td>
</tr>
<tr>
<td><strong>Letta</strong></td>
<td>Yes</td>
<td><strong>Yes</strong> — deepest</td>
<td>Yes</td>
<td>No</td>
<td>Architecture</td>
</tr>
</tbody>
</table>
<p>&quot;Agent writes durable state, reads it back, model swappable&quot; is <strong>Letta's 2023 founding idea.</strong> Leave &quot;unverified&quot; unverified on the slide.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="61" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="for-the-claude-code-power-user-specifically">For the Claude Code power user specifically</h2>
<p>You've hand-built most of this already. <strong>Two things you don't get automatically:</strong></p>
<div class="stat-grid">
<div class="stat"><div class="num">1</div><div class="label">Full-text search across every past raw session</div></div>
<div class="stat"><div class="num">2</div><div class="label">An unattended job that prunes and merges memory + skills on a schedule, unasked</div></div>
</div>
<p>Both buildable — a hook, an SQLite index, a cron job. Which <em>is</em> the point.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-marpit-fragments="5" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="62" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="answer-the-sharp-question-with-the-ladder">Answer the sharp question with the ladder</h2>
<blockquote>
<p><em>&quot;Claude Code writes files too. So what's actually different?&quot;</em></p>
</blockquote>
<ol>
<li data-marpit-fragment="1">Filesystem access → rung 1. Proves nothing.</li>
<li data-marpit-fragment="2"><code>CLAUDE.md</code> / <code>AGENTS.md</code> → rung 2.</li>
<li data-marpit-fragment="3">Claude Code's Auto Memory → rung 3.</li>
<li data-marpit-fragment="4">Unattended curation + search retrieval → rung 4.</li>
<li data-marpit-fragment="5">Skill synthesis with a retirement lifecycle → rung 5.</li>
</ol>
<p><strong>Hermes ships 3→5 wired together and turned on by default.</strong> Real, checkable, and smaller than the launch copy implies.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="automata" lang="en-US" data-marpit-pagination="63" style="--paginate:true;--theme:automata;" data-marpit-pagination-total="64">
<h2 id="where-to-go-next">Where to go next</h2>
<ul>
<li><a href="https://hermes-agent.nousresearch.com/docs/">Official docs</a> — the canonical reference</li>
<li><a href="https://github.com/nousresearch/hermes-agent"><code>NousResearch/hermes-agent</code></a> on GitHub (MIT)</li>
<li><strong>awesome-hermes-agent</strong> — the community list</li>
<li><strong>Hermes self-evolution repo</strong> — agent-improving-itself experiments</li>
<li><a href="https://agentskills.io">agentskills.io</a> — the skill standard, shared with Claude Code</li>
</ul>
<p><strong>Ship the artifacts:</strong> <code>SOUL.md</code> · <code>AGENTS.md</code> · <code>config.yaml</code> · cron commands · the eval CSV.<br />
Reproducibility is the #1 complaint about every comparable course.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-class="dark lead" data-theme="automata" lang="en-US" class="dark lead" style="--class:dark lead;--theme:automata;"><div class="kicker">One slide to remember</div>
<h1 id="the-model-is-a-component-the-context-is-the-emassetem">The model is a component. The context is the <em>asset</em>.</h1>
<p>Build the context deliberately · wire new power at low blast radius first · measure with an eval set instead of a feeling.</p>
</section>
